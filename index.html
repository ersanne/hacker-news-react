<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f6f2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#181916" />
    <meta name="description" content="A quieter way to read Hacker News. Good stories, thoughtful conversations, and room to read." />
    <meta name="author" content="Erik Sanne" />
    <link rel="canonical" href="https://hn.eriksanne.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- Link previews are built by scrapers that never run JavaScript, so the
         card is the site's own and the same on every URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HN Reader" />
    <meta property="og:title" content="HN Reader — A little less noise." />
    <meta property="og:description" content="A quieter way to read Hacker News. Good stories, thoughtful conversations, and room to read." />
    <meta property="og:url" content="https://hn.eriksanne.com/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://hn.eriksanne.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="HN Reader — a quieter corner of Hacker News." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HN Reader — A little less noise." />
    <meta name="twitter:description" content="A quieter way to read Hacker News. Good stories, thoughtful conversations, and room to read." />
    <meta name="twitter:image" content="https://hn.eriksanne.com/og-image.png" />
    <title>HN Reader — A little less noise.</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "HN Reader",
        "url": "https://hn.eriksanne.com/",
        "description": "A quieter way to read Hacker News. Good stories, thoughtful conversations, and room to read.",
        "inLanguage": "en",
        "author": { "@type": "Person", "name": "Erik Sanne" }
      }
    </script>
    <script>
      try { var t = localStorage.getItem('hn-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
