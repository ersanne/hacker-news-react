[tools]
node = "24.21.0"
pnpm = "12.4.1"

[tasks.install]
run = "pnpm install --frozen-lockfile"
description = "Install dependencies from the lockfile"
sources = ["pnpm-lock.yaml"]
outputs = { auto = true }

[tasks.dev]
depends = ["install"]
run = "pnpm run dev"
description = "Start the Vite dev server"

[tasks.build]
depends = ["install"]
run = "pnpm run build"
description = "Typecheck and build for production"

[tasks.test]
depends = ["install"]
run = "pnpm run test"
description = "Run unit tests"

[tasks.test-e2e]
depends = ["install"]
run = "pnpm run test:e2e"
description = "Run Playwright end-to-end tests"

[tasks.lint]
depends = ["install"]
run = "pnpm run lint"
description = "Lint the sources"

[tasks.typecheck]
depends = ["install"]
run = "pnpm run typecheck"
description = "Typecheck without emitting"
